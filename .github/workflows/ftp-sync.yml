name: FTP Tools

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list: 폴더 목록 보기 / pull: 서버 파일을 GitHub으로 가져오기 / fix-perms: .htaccess·폴더 권한 복구"
        required: true
        default: list
        type: choice
        options:
          - list
          - pull
          - fix-perms
          - diagnose
      remote_dir:
        description: "서버 경로 (예: /public_html)"
        required: true
        default: "/"

permissions:
  contents: write

jobs:
  ftp:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      REMOTE_DIR: ${{ inputs.remote_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Prepare lftp
        run: |
          cat > ~/.lftprc <<EOF
          set ftp:ssl-allow true
          set ssl:verify-certificate false
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          EOF

      - name: Diagnose
        if: inputs.mode == 'diagnose'
        run: |
          check() {
            local name="$1" value="$2"
            local trimmed="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            echo "$name: length=${#value}, trimmed_length=${#trimmed}, has_at=$([[ "$value" == *@* ]] && echo yes || echo no)"
          }
          check FTP_SERVER "$FTP_SERVER"
          check FTP_USERNAME "$FTP_USERNAME"
          check FTP_PASSWORD "$FTP_PASSWORD"
          check FTP_PORT "$FTP_PORT"
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          echo "--- resolve secret host ---"
          getent hosts "$FTP_SERVER" || echo "secret host NXDOMAIN"
          echo "--- curl secret host ---"
          curl -s --netrc --list-only --max-time 30 "ftp://$FTP_SERVER:${FTP_PORT:-21}/" -o /dev/null -w "result=%{response_code}\n" || true
          echo "--- curl meeple.co.kr ---"
          printf 'machine meeple.co.kr\nlogin %s\npassword %s\n' "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          curl -s --netrc --list-only --max-time 30 "ftp://meeple.co.kr:21/" -w "result=%{response_code}\n" || true
          echo "--- curl explicit TLS ---"
          curl -s --netrc --ssl-reqd -k --list-only --max-time 30 "ftp://$FTP_SERVER:${FTP_PORT:-21}/" -o /dev/null -w "result=%{response_code}\n" || true
          echo "--- sftp port 22 ---"
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p 22 "$FTP_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -p "$FTP_PASSWORD" sftp -o StrictHostKeyChecking=no -P 22 "$FTP_USERNAME@$FTP_SERVER" <<'EOF' || true
          pwd
          ls
          bye
          EOF

      - name: List
        if: inputs.mode == 'list'
        run: |
          host="${FTP_SERVER}"
          if ! getent hosts "$host" >/dev/null 2>&1; then
            echo "Secret host does not resolve, using meeple.co.kr"
            host="meeple.co.kr"
          fi
          echo "Connecting to $host"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$host" \
            -e "pwd; cls -la; cls -la www; cls -la '$REMOTE_DIR'; bye"

      - name: Fix permissions
        if: inputs.mode == 'fix-perms'
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_SERVER" -e "
            set cmd:fail-exit false;
            chmod 755 '$REMOTE_DIR';
            chmod 644 '$REMOTE_DIR/.htaccess';
            cls -la '$REMOTE_DIR';
            bye"

      - name: Pull from server
        if: inputs.mode == 'pull'
        run: |
          mkdir -p site
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_SERVER" -e "
            mirror --verbose --parallel=5 \
              --exclude-glob .ftp-deploy-sync-state.json \
              '$REMOTE_DIR' site;
            bye"
          find site -type f -size +95M -print -delete
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A site
          git commit -m "Import site files from FTP ($REMOTE_DIR)" || echo "No changes"
          git push
